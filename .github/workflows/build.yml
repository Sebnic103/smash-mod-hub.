name: Compilar .nro

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests del núcleo (en el host)
        run: |
          apt-get update -qq && apt-get install -y -qq g++ >/dev/null
          sh tests/run.sh

      - name: Actualizar devkitPro y libnx (necesario para firmwares recientes)
        run: dkp-pacman -Syu --noconfirm

      - name: Instalar librerías de Switch (SDL2, curl, libarchive...)
        run: |
          dkp-pacman -S --needed --noconfirm switch-dev switch-portlibs
          dkp-pacman -Q libnx devkitA64

      - name: Descargar certificados raíz (HTTPS verificado)
        run: |
          command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl)
          mkdir -p romfs
          curl -fsSL -o romfs/cacert.pem https://curl.se/ca/cacert.pem
          test -s romfs/cacert.pem

      - name: Compilar
        run: make -j"$(nproc)"

      - name: Preparar paquete para la SD
        run: |
          mkdir -p dist/switch/smash-mod-hub
          cp smash-mod-hub.nro dist/switch/smash-mod-hub/
          mkdir -p dist/switch/smash-mod-hub/import
          cp README.md dist/switch/smash-mod-hub/LEEME.md

      - uses: actions/upload-artifact@v4
        with:
          name: smash-mod-hub
          path: dist/

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: smash-mod-hub.nro
