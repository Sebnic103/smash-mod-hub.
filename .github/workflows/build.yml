name: Compilar .nro

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      # Los tests son mi comprobación del núcleo: si fallan por culpa del entorno de GitHub no deben impedir
      # que se compile el .nro (queda un aviso amarillo en lugar de una X roja).
      - name: Tests del núcleo (en el host)
        continue-on-error: true
        run: |
          apt-get update -qq && apt-get install -y -qq g++ curl ca-certificates >/dev/null
          sh tests/run.sh

      # pkg.devkitpro.org a veces responde 403 o se cae (está muy cargado). Por eso todo lo que baja paquetes
      # reintenta con esperas crecientes, y a partir del 3.er intento descarga con curl y cabecera de navegador.
      - name: Actualizar devkitPro y libnx (necesario para firmwares recientes)
        continue-on-error: true
        run: |
          command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null)
          . ./.github/dkp-retry.sh
          dkp_retry dkp-pacman -Syu --noconfirm

      - name: Instalar librerías de Switch (SDL2, curl, libarchive...)
        run: |
          command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null)
          . ./.github/dkp-retry.sh
          dkp_retry dkp-pacman -S --needed --noconfirm switch-dev switch-portlibs
          dkp-pacman -Q libnx devkitA64

      - name: Descargar certificados raíz (HTTPS verificado)
        run: |
          command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null)
          mkdir -p romfs
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o romfs/cacert.pem https://curl.se/ca/cacert.pem
          test -s romfs/cacert.pem

      - name: Compilar
        run: make -j"$(nproc)"

      - name: Preparar paquete para la SD
        run: |
          mkdir -p dist/switch/smash-mod-hub
          cp smash-mod-hub.nro dist/switch/smash-mod-hub/
          mkdir -p dist/switch/smash-mod-hub/import
          cp README.md dist/switch/smash-mod-hub/LEEME.md

      - uses: actions/upload-artifact@v4
        with:
          name: smash-mod-hub
          path: dist/

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: smash-mod-hub.nro
